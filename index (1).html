<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Magnet Mayhem</title>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <style>
      :root {
        --navy: #0a1226;
        --cy: #27e1ff;
        --or: #ff7a1a;
        --ink: #e8f6ff;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        touch-action: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--navy);
        overflow: hidden;
        font-family: "Trebuchet MS", Verdana, sans-serif;
        color: var(--ink);
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
      }
      .pn {
        margin: 6px 0;
        padding: 8px;
        border: 1px solid #1d3a63;
        border-radius: 6px;
        font-size: 13px;
        text-align: left;
      }
      .pn button {
        font-size: 13px;
        padding: 6px 12px;
      }
      #cl {
        position: fixed;
        left: 10px;
        bottom: 90px;
        max-width: min(360px, 70vw);
        font-size: 13px;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
        z-index: 4;
      }
      #ci {
        position: fixed;
        left: 10px;
        bottom: 20px;
        width: min(340px, 80vw);
        display: none;
        z-index: 6;
      }
      #dbg {
        position: fixed;
        left: 8px;
        top: 70px;
        z-index: 7;
        background: #0a1226ee;
        border: 1px solid #27e1ff66;
        padding: 8px;
        font: 12px monospace;
        display: none;
      }
      #dbg input,
      #dbg select {
        width: 110px;
        font-size: 12px;
        padding: 4px;
        margin: 2px;
      }
      #dbg button {
        font-size: 12px;
        padding: 5px 9px;
      }
      #ts {
        position: fixed;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 8;
        background: #0a1226;
        border: 2px solid #ff7a1a;
        border-radius: 10px;
        padding: 10px 14px;
        display: none;
      }
      #mu,
      #fs,
      #sk,
      #dv {
        position: fixed;
        z-index: 5;
        top: calc(8px + env(safe-area-inset-top, 0px));
        width: 38px;
        height: 38px;
        padding: 0;
        margin: 0;
        font-size: 17px;
        border-radius: 50%;
        background: #122a4d;
        color: var(--ink);
        box-shadow: 0 0 0 2px #27e1ff66;
      }
      #mu {
        left: 10px;
        top: calc(50% - 44px);
      }
      #fs {
        left: 10px;
        top: 50%;
      }
      #ui {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 9, 22, 0.74);
      }
      #ui.hide {
        display: none;
      }
      .card {
        text-align: center;
        padding: 26px 34px;
        border: 2px solid #1d3a63;
        border-radius: 6px 22px 6px 22px;
        background: linear-gradient(#0f1c38, #0a1226);
        box-shadow:
          0 0 0 4px #0a1226,
          0 0 40px #27e1ff33;
        max-width: 92vw;
        max-height: 96vh;
        overflow: auto;
      }
      h1 {
        font:
          900 clamp(32px, 8vw, 62px)/0.95 Impact,
          "Arial Black",
          sans-serif;
        margin: 0 0 8px;
        letter-spacing: 1px;
        transform: skew(-6deg);
      }
      h1 b {
        color: var(--cy);
        text-shadow: 0 0 18px #27e1ff88;
      }
      h1 i {
        color: var(--or);
        font-style: normal;
        text-shadow: 0 0 18px #ff7a1a88;
      }
      p {
        margin: 6px 0 14px;
        opacity: 0.88;
        line-height: 1.45;
      }
      .st {
        font-size: 34px;
        color: #ffd24a;
        letter-spacing: 6px;
      }
      button {
        font:
          800 18px "Trebuchet MS",
          sans-serif;
        padding: 12px 26px;
        margin: 5px;
        border: 0;
        border-radius: 4px 14px 4px 14px;
        background: var(--or);
        color: #1a0b00;
        cursor: pointer;
        box-shadow: 0 4px 0 #a34100;
        touch-action: manipulation;
      }
      button:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #a34100;
      }
      button.alt {
        background: var(--cy);
        box-shadow: 0 4px 0 #0a7f94;
        color: #00232b;
      }
      button:focus-visible {
        outline: 3px solid #fff;
      }
      input {
        font:
          700 16px "Trebuchet MS",
          sans-serif;
        padding: 9px 12px;
        margin: 3px;
        width: 150px;
        border-radius: 4px 12px 4px 12px;
        border: 2px solid #1d3a63;
        background: #0a1226;
        color: #e8f6ff;
        user-select: text;
        -webkit-user-select: text;
        touch-action: auto;
      }
      #tc {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        justify-content: space-between;
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }
      #tc div {
        display: flex;
        gap: 10px;
        pointer-events: auto;
      }
      #tc button {
        width: 62px;
        height: 62px;
        padding: 0;
        border-radius: 50%;
        font-size: 22px;
        opacity: 0.72;
        background: #122a4d;
        color: var(--ink);
        box-shadow: 0 0 0 2px #27e1ff88;
      }
      #tc button.on {
        background: var(--cy);
        color: #00232b;
      }
      .ver {
        font-size: 11px;
        opacity: 0.6;
        cursor: pointer;
      }
      .card:has(.wg),
      .card:has(.lg) {
        width: min(860px, 94vw);
      }
      .wg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
        margin-top: 10px;
      }
      .wc {
        padding: 12px;
        border: 2px solid var(--a);
        border-radius: 6px 18px 6px 18px;
        background: linear-gradient(135deg, var(--b), #0a1226);
        cursor: pointer;
        text-align: left;
        box-shadow: 0 0 18px color-mix(in srgb, var(--a) 30%, transparent);
        transition: transform 0.12s;
      }
      .wc:hover {
        transform: translateY(-3px) scale(1.02);
      }
      .wc.lk {
        filter: grayscale(0.9) brightness(0.55);
        cursor: not-allowed;
      }
      .wn {
        font:
          900 34px Impact,
          "Arial Black",
          sans-serif;
        color: var(--a);
        line-height: 1;
      }
      .wt {
        font-weight: 800;
        margin: 2px 0;
      }
      .wb {
        font-size: 12px;
      }
      .wk {
        font-size: 11px;
        margin-top: 6px;
        color: #ff9a8a;
      }
      .lg {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        margin-top: 10px;
      }
      .lt {
        border: 2px solid var(--a);
        border-radius: 8px 16px 8px 16px;
        padding: 10px 4px;
        cursor: pointer;
        background: #0f1c38;
        text-align: center;
      }
      .lt.bs {
        grid-column: span 5;
        background: linear-gradient(90deg, #3a1218, #0f1c38);
        padding: 14px;
      }
      .lt.lk {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .ln {
        font:
          900 26px Impact,
          "Arial Black",
          sans-serif;
      }
      .ls {
        color: #ffd24a;
        font-size: 14px;
        letter-spacing: 2px;
      }
      .ls span {
        opacity: 0.25;
      }
      .lb {
        font-size: 11px;
        letter-spacing: 3px;
        color: #ff9a8a;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #vr {
        position: fixed;
        right: 8px;
        bottom: 4px;
        font-size: 10px;
        opacity: 0.45;
        z-index: 3;
        pointer-events: none;
      }
      #sk {
        left: 10px;
        top: calc(50% + 44px);
      }
      #dv {
        left: 10px;
        top: calc(50% + 88px);
        font-size: 10px;
      }
      #sk {
        width: auto;
        padding: 0 12px;
        border-radius: 19px;
        font-size: 12px;
      }
      #ld {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #16305e, #070d1f 70%);
        overflow: hidden;
      }
      #ld::before {
        content: "";
        position: absolute;
        inset: -50%;
        background: repeating-conic-gradient(
          from 0deg,
          #27e1ff12 0 6deg,
          #0000 6deg 18deg
        );
        animation: sp 40s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .lw {
        position: relative;
        text-align: center;
      }
      .lw svg {
        animation: fl 2.2s ease-in-out infinite;
        filter: drop-shadow(0 0 18px #27e1ff88);
      }
      @keyframes fl {
        50% {
          transform: translateY(-10px) rotate(4deg);
        }
      }
      .bar {
        width: min(320px, 70vw);
        height: 10px;
        margin: 14px auto;
        border-radius: 6px;
        background: #0a1226;
        border: 1px solid #1d3a63;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #27e1ff, #ff7a1a);
      }
      #lp {
        visibility: hidden;
        font-size: 26px;
        padding: 14px 60px;
        animation: pu 1.2s ease-in-out infinite;
      }
      @keyframes pu {
        50% {
          transform: scale(1.07);
        }
      }
      #lt2 {
        font-size: 12px;
        opacity: 0.6;
        margin-top: 6px;
      }
      #mu,
      #fs,
      #pb,
      #rb,
      #dv {
        position: fixed;
        z-index: 5;
        left: 10px;
        width: 38px;
        height: 38px;
        padding: 0;
        margin: 0;
        font-size: 17px;
        border-radius: 50%;
        background: #122a4d;
        color: var(--ink);
        box-shadow: 0 0 0 2px #27e1ff66;
      }
      #mu {
        top: calc(50% - 132px);
      }
      #fs {
        top: calc(50% - 88px);
      }
      #pb {
        top: calc(50% - 44px);
      }
      #rb {
        top: 50%;
      }
      #dv {
        top: calc(50% + 44px);
        font-size: 10px;
      }
      #pb,
      #rb {
        display: none;
      }
      .ing #pb,
      .ing #rb {
        display: block;
      }
      #tc {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        justify-content: space-between;
        align-items: flex-end;
        padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px));
        z-index: 4;
        pointer-events: none;
      }
      .tch.ing #tc {
        display: flex;
      }
      #tc .tg {
        display: flex;
        gap: 10px;
        pointer-events: auto;
        align-items: flex-end;
      }
      #tc button {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        font-size: 24px;
        opacity: 0.8;
        background: #122a4d;
        color: var(--ink);
        box-shadow: 0 0 0 2px #27e1ff88;
        padding: 0;
        margin: 0;
      }
      #tc button.big {
        width: 80px;
        height: 80px;
        font-size: 30px;
      }
      #tc button.on {
        background: var(--cy);
        color: #00232b;
      }
      .shp {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 14px;
        text-align: left;
      }
      @media (max-width: 620px) {
        .shp {
          grid-template-columns: 1fr;
        }
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .tb {
        padding: 6px 10px;
        font-size: 12px;
        margin: 2px;
      }
      .tb.on {
        background: var(--cy);
        color: #00232b;
      }
      .ig {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
        margin-top: 8px;
      }
      .ic {
        border: 1px solid #1d3a63;
        border-radius: 8px;
        padding: 8px;
        text-align: center;
      }
      .ic.eq {
        border-color: #ffd24a;
        box-shadow: 0 0 10px #ffd24a44;
      }
      .ic button {
        font-size: 12px;
        padding: 6px 10px;
        margin: 3px;
      }
      .coin {
        color: #ffd24a;
        font-weight: 800;
      }
      #pv {
        width: 180px;
        height: 180px;
        border-radius: 12px;
        border: 2px solid #1d3a63;
        background: #0a1226;
      }
      #ld::before {
        display: none;
      }
      .bgr {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 220vmax;
        height: 220vmax;
        margin: -110vmax 0 0 -110vmax;
        background: repeating-conic-gradient(
          from 0deg,
          #27e1ff14 0 6deg,
          #0000 6deg 18deg
        );
        animation: sp 70s linear infinite;
      }
      .ob {
        position: absolute;
        border-radius: 50%;
        animation: fl 6s ease-in-out infinite;
      }
      .o1 {
        width: 120px;
        height: 120px;
        left: 10%;
        top: 18%;
        background: radial-gradient(#27e1ff55, #0000 70%);
      }
      .o2 {
        width: 160px;
        height: 160px;
        right: 8%;
        top: 55%;
        background: radial-gradient(#ff7a1a44, #0000 70%);
        animation-delay: -2s;
      }
      .o3 {
        width: 90px;
        height: 90px;
        left: 30%;
        bottom: 10%;
        background: radial-gradient(#c79bff55, #0000 70%);
        animation-delay: -4s;
      }
      #lg {
        margin-top: 10px;
        max-width: min(430px, 86vw);
        text-align: left;
        font-size: 13px;
        background: #0a1226cc;
        border: 1px solid #1d3a63;
        border-radius: 8px;
        padding: 10px 14px;
        max-height: 34vh;
        overflow: auto;
      }
      #lg li {
        margin: 5px 0;
      }
      @media (max-width: 700px) {
        #tc {
          padding-left: 8px;
          padding-right: 8px;
        }
        #tc .tg {
          gap: clamp(4px, 1.5vw, 10px);
        }
        #tc button {
          width: clamp(38px, 11vw, 58px);
          height: clamp(38px, 11vw, 58px);
          font-size: clamp(17px, 5vw, 22px);
        }
        #tc button.big {
          width: clamp(48px, 14vw, 68px);
          height: clamp(48px, 14vw, 68px);
          font-size: clamp(22px, 7vw, 30px);
        }
      }
      @media (max-height: 520px) {
        .card {
          padding: 14px 18px;
          max-height: 96dvh;
        }
        #mu,
        #fs,
        #pb,
        #rb,
        #dv {
          width: 34px;
          height: 34px;
        }
        #mu {
          top: 6px;
        }
        #fs {
          top: 44px;
        }
        #pb {
          top: 82px;
        }
        #rb {
          top: 120px;
        }
        #dv {
          top: 158px;
        }
        #tc {
          padding-top: 6px;
          padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
        }
      }
      @media (max-height: 360px) {
        #dv {
          display: none;
        }
      }
      body.ad-lock button {
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>

    <button id="mu" onclick="tm()" aria-label="Sound">🔊</button>
    <button id="fs" onclick="tf()" aria-label="Fullscreen">⛶</button>
    <button id="pb" onclick="pause()" aria-label="Pause">⏸</button>
    <button id="rb" onclick="respawnCP()" aria-label="Back to checkpoint">
      ↺
    </button>
    <button id="dv" onclick="dbgT()">DEV</button>
    <div id="tc">
      <div class="tg">
        <button data-k="l">◀</button><button data-k="r">▶</button>
      </div>
      <div class="tg">
        <button data-k="d" id="tdn">▼</button>
        <button data-k="f">⇄</button>
        <button data-k="m" class="big">🧲</button>
        <button data-k="j">▲</button>
      </div>
    </div>

        const d = Math.min(devicePixelRatio || 1, 2);
        const width = Math.max(1, innerWidth);
        const height = Math.max(
          1,
          window.visualViewport?.height || innerHeight,
        );
        cv.width = Math.round(width * d);
        cv.height = Math.round(height * d);
        W = cv.width;
        H = cv.height;
        S = H / VH;
        VW = W / S;
      }

                `<h1><b>FULL</b> <i>SCREEN?</i></h1><p>Fullscreen gives you the best view.</p><div><button onclick='fsYes()'>Go fullscreen</button><button class=alt onclick='fsNo(0)'>No thanks</button></div><div><button class=alt style='font-size:13px' onclick='fsNo(1)'>Do not ask again</button></div>`,
              );
            }
          }
        } catch (e) {}
      }
      function fsYes() {
        tf();
        resume();
      }
      function fsNo(n) {
        if (n)
          try {
            localStorage.setItem("fsno", "1");
          } catch (e) {}
        resume();
      }
      /* ---------- win, menus, shop ---------- */
      function win() {
        if (st != "play") return;
        clearInput();
        st = "win";
        PK.stop();
        const s = got == tot ? 3 : got >= Math.ceil(tot * 0.6) ? 2 : 1,
          a = stars();
        a[lv] = Math.max(a[lv] || 0, s);
        sv(a);
        const earn = got + (s == 3 ? 5 : 0);
        SAVE.c += earn;
        saveS();
        sfx("win");
        const last = lv % 10 == 9,
          nx = !last && lv < 99 && (UA || a[lv] >= 2),
          w = L.wd | 0;
        show(
          `<h1><b>${last ? (lv == 99 ? "GAME" : "WORLD") : "LEVEL"}</b> <i>${last ? "CLEARED" : "CLEAR"}</i></h1>${last ? `<p style='font-size:18px'>${WN[w]} complete!</p>` : ""}<div class=st>${"\u2605".repeat(s)}<span style='opacity:.25'>${"\u2605".repeat(3 - s)}</span></div><p>Orbs ${got} of ${tot}<br>Falls ${dl}<br>Time ${lt.toFixed(1)} s<br><b style='color:#ffd24a'>+${earn} orbs</b></p>${!last && !nx ? '<p style="color:#ff7a1a">You need 2 stars to unlock the next level.</p>' : ""}${last && s < 2 ? '<p style="color:#ff7a1a">You need 2 stars to unlock the next world.</p>' : ""}<div>${nx ? `<button onclick='load(${lv + 1})'>Next level</button>` : ""}<button class=alt onclick='load(lv)'>${last ? "Restart" : "Retry"}</button><button class=alt onclick='${last ? "menu()" : `wsel(${w})`}'>${last ? "Menu" : "Levels"}</button></div>`,
        );
      }
      function menu() {
        st = "menu";
        PK.stop();
        setCard = menu;
        const a = stars();
        let nx = 0;
        while (nx < 99 && unl(nx) && (a[nx] || 0) >= 2) nx++;
        let h = `<h1><b>MAGNET</b><br><i>MAYHEM</i></h1><div class=top><span class=coin>\ud83d\udd29 ${SAVE.c} orbs</span><span><button class=alt onclick='shop()'>Shop</button></span></div><div><button onclick='load(${nx})'>${nx ? "Continue" : "Play"}</button></div><p style='font-size:13px'>Move: A D or arrows. Jump: W, Up or Space. Magnet: K or left mouse. Flip polarity: Shift. P pause, R back to checkpoint.</p><div><button class=alt style='font-size:13px;padding:6px 14px' onclick='togM()'>Music: ${musOn ? "On" : "Off"}</button><button class=alt style='font-size:13px;padding:6px 14px' onclick='togS()'>Sound: ${sfxOn ? "On" : "Off"}</button></div><div class=wg>`;
        for (let w = 0; w < 10; w++) {
          let sc = 0;
          for (let q = 0; q < 10; q++) sc += a[w * 10 + q] || 0;
          const u = unl(w * 10);
          h += `<div class='wc${u ? "" : " lk"}' style='--a:${TH[w][5]};--b:${TH[w][1]}' ${u ? `onclick='wsel(${w})'` : ""}><div class=wn>${w + 1}</div><div class=wt>${WN[w]}</div><div class=wb>${u ? "\u2605 " + sc + " / 30" : "\ud83d\udd12 Locked"}</div></div>`;
        }
        show(h + "</div>");
      }
      function wsel(w) {
        st = "menu";
        PK.stop();
        const a = stars();
        let h = `<div class=top><button class=alt onclick='menu()'>\u25C0 Worlds</button><span class=coin>\ud83d\udd29 ${SAVE.c}</span></div><h1 style='font-size:clamp(26px,6vw,44px);color:${TH[w][5]}'>${WN[w]}</h1><p>World ${w + 1} of 10</p><div class=lg>`;
        for (let q = 0; q < 10; q++) {
          const i = w * 10 + q,
            u = unl(i),
            s = a[i] || 0,
            fin = q == 9;
          h += `<div class='lt${u ? "" : " lk"}${fin ? " bs" : ""}' style='--a:${fin ? "#ffd24a" : TH[w][5]}' ${u ? `onclick='load(${i})'` : ""}><div class=ln>${fin ? "\u2605 Finale" : q + 1}</div>${u ? `<div class=ls>${"\u2605".repeat(s)}<span>${"\u2605".repeat(3 - s)}</span></div>` : "<div class=ls>\ud83d\udd12</div>"}</div>`;
        }
        show(h + "</div>");
      }
      let shopCat = "skin",
        pvRun = 0,
        pvp = [],
        pvT = 0;
      function shop(cat) {
        st = "menu";
        PK.stop();
        if (cat) shopCat = cat;
        setCard = () => shop();
        const C = CAT[shopCat];
        let h =
          `<div class=top><button class=alt onclick='menu()'>\u25C0 Menu</button><span class=coin>\ud83d\udd29 ${SAVE.c} orbs</span></div><h1 style='font-size:clamp(26px,6vw,40px)'><b>ROBOT</b> <i>SHOP</i></h1><div class=shp><div><canvas id=pv width=180 height=180></canvas><p style='font-size:12px;opacity:.7'>Cosmetics only. They never change gameplay.</p></div><div><div class=tabs>` +
          Object.keys(CAT)
            .map(
              (k) =>
                `<button class='tb${k == shopCat ? " on" : ""}' onclick="shop('${k}')">${CAT[k].n}</button>`,
            )
            .join("") +
          `</div><div class=ig>` +
          C.it
            .map((it) => {
              const own = it[2] == 0 || SAVE.o.includes(it[0]),
                eq = SAVE.e[shopCat] == it[0];
              return `<div class='ic${eq ? " eq" : ""}'><b>${it[1]}</b><button onclick="${own ? `equip('${it[0]}')` : `buy('${it[0]}')`}">${eq ? "Equipped" : own ? "Equip" : "Buy " + it[2]}</button>${"df ds sf".includes(shopCat) ? `<button class=alt onclick="testFX('${it[0]}')">Test</button>` : ""}</div>`;
            })
            .join("") +
          `</div></div></div>`;
        show(h);
        startPv();
      }
      function equip(id) {
        SAVE.e[shopCat] = id;
        saveS();
        sfx("click");
        shop();
      }
      function buy(id) {
        const it = item(shopCat, id);
        if (SAVE.c >= it[2]) {
          SAVE.c -= it[2];
          SAVE.o.push(id);
          SAVE.e[shopCat] = id;
          saveS();
          sfx("buy");
          shop();
        } else {
          sfx("hurt");
          const e = $("pv");
          if (e) e.style.outline = "2px solid #ff5d5d";
          setTimeout(() => {
            const q = $("pv");
            if (q) q.style.outline = "";
          }, 500);
        }
      }
      function testFX(id) {
        const cat = id.slice(0, 2);
        if (cat == "ds") deathSnd(id);
        else if (cat == "df") {
          fxD(id, 90, 100, (p) => pvp.push(p));
          deathSnd();
        } else fxS(id, 90, 150, (p) => pvp.push(p));
      }
      function startPv() {
        if (!$("pv")) return;
        if (!pvRun) {
          pvRun = 1;
          requestAnimationFrame(pvLoop);
        }
      }
      function pvLoop() {
        const e = $("pv");
        if (!e) {
          pvRun = 0;
          return;
        }
        const c = e.getContext("2d");
        pvT += 1 / 60;
        c.clearRect(0, 0, 180, 180);
        const gr = c.createLinearGradient(0, 0, 0, 180);
        gr.addColorStop(0, "#16305e");
        gr.addColorStop(1, "#0a1226");
        c.fillStyle = gr;
        c.fillRect(0, 0, 180, 180);
        c.fillStyle = "#2a4674";
        c.fillRect(0, 150, 180, 30);
        c.fillStyle = "#4f86c4";
        c.fillRect(0, 150, 180, 3);
        const run = Math.sin(pvT * 0.8) > 0 ? 1 : 0,
          on = pvT % 3 < 1.5,
          md = ((pvT / 3) | 0) % 2 ? -1 : 1,
          col = md > 0 ? "#27e1ff" : "#ff7a1a";
        c.save();
        c.translate(90, 150);
        c.scale(3, 3);
        c.translate(-0, 0);
        drawBot(c, {
          x: 0,
          y: 0,
          f: 1,
          sq: 0,
          run,
          w: Math.sin(pvT * 14) * run,
          col,
          on,
          t: pvT,
          sk: item("skin"),
          mg: item("mag"),
          hat: SAVE.e.hat,
        });
        c.restore();
        for (const p of pvp) {
          p.l -= 1 / 60;
          p.x += p.vx / 60;
          p.y += p.vy / 60;
          p.vy += (p.gv == null ? 300 : p.gv) / 60;
          c.globalAlpha = Math.max(0, p.l / p.m);
          c.fillStyle = p.c;
          if (p.ch) {
            c.font = "bold " + p.s + "px Arial";
            c.textAlign = "center";
            c.fillText(p.ch, p.x, p.y);
          } else c.fillRect(p.x, p.y, p.s, p.s);
        }
        c.globalAlpha = 1;
        pvp = pvp.filter((p) => p.l > 0);
        requestAnimationFrame(pvLoop);
      }
      /* ---------- input (keyboard, mouse, touch) ---------- */
      const kd = {
        ArrowLeft: "l",
        KeyA: "l",
        ArrowRight: "r",
        KeyD: "r",
        ArrowUp: "j",
        KeyW: "j",
        Space: "j",
        ArrowDown: "d",
        KeyS: "d",
      };
      function setTouch(v) {
        v = v ? 1 : 0;
        if (touchOn === v) return;
        touchOn = v;
        document.body.classList.toggle("tch", !!v);
      }
      function tcUpd() {
        const d = $("tdn");
        if (d) d.style.display = L && L.an && L.an.length ? "flex" : "none";
      }
      function clearInput() {
        K.l = K.r = K.j = K.d = 0;
        M.k = M.m = M.t = 0;
      }
      addEventListener("keydown", (e) => {
        if (PK.breaking) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return;
        }
        if (e.target?.tagName == "INPUT") return;
        setTouch(0);
        const k = kd[e.code];
        if (k) {
          K[k] = 1;
          if (k == "j" && !e.repeat) jp = 0.12;
          e.preventDefault();
        } else if (e.code == "KeyK") {
          M.k = 1;
        } else if (e.code == "ShiftLeft" || e.code == "ShiftRight") {
          if (!e.repeat && st == "play") flip();
        } else if (e.code == "KeyP" || e.code == "Escape") {
          pause();
        } else if (e.code == "KeyR" && st == "play") {
          respawnCP();
        } else if (e.code == "F3") {
          e.preventDefault();
          dbgT();
        }
      });
      addEventListener("keyup", (e) => {
        const k = kd[e.code];
        if (k) K[k] = 0;
        if (e.code == "KeyK") M.k = 0;
      });
      addEventListener("blur", () => {
        clearInput();
        if (st == "play") pause();
        else if (PK.breaking) PK.pauseAfterBreak = true;
      });
      cv.addEventListener("mousedown", (e) => {
        if (PK.breaking || e.pointerType == "touch") return;
        if (e.button == 0) M.m = 1;
        if (e.button == 2 && st == "play") flip();
      });
      addEventListener("mouseup", () => (M.m = 0));
      cv.addEventListener("contextmenu", (e) => e.preventDefault());
      addEventListener("touchstart", () => setTouch(1), { passive: true });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) return;
        clearInput();
        if (st == "play") pause();
        else if (PK.breaking) PK.pauseAfterBreak = true;
      });
      document.querySelectorAll("#tc button").forEach((b) => {
        const k = b.dataset.k;
        const on = (e) => {
          e.preventDefault();
          if (PK.breaking) return;
          setTouch(1);
          b.classList.add("on");
          try {
            b.setPointerCapture(e.pointerId);
          } catch (x) {}
          if (k == "m") {
            M.t = 1;
          } else if (k == "f") {
            if (st == "play") flip();
          } else {
            K[k] = 1;
            if (k == "j") jp = 0.12;
          }
        };
        const off = () => {
          b.classList.remove("on");
          if (k == "m") M.t = 0;
          else if (k != "f") K[k] = 0;
        };
        b.addEventListener("pointerdown", on);
        ["pointerup", "pointercancel", "lostpointercapture"].forEach((n) =>
          b.addEventListener(n, off),
        );
      });
      setTouch(matchMedia("(pointer:coarse)").matches);
      /* ---------- debug ---------- */
      function dbgT() {
        dbgOn = !dbgOn;
        let e = $("dbg");
        if (!e) {
          e = document.createElement("div");
          e.id = "dbg";
          e.innerHTML = `<pre id=ds></pre><button onclick='god=!god'>God</button><button onclick='die()'>Kill</button><button onclick='UA=!UA'>Unlock all</button><button onclick='if(st=="play")win()'>Win</button><button onclick='SAVE.c+=500;saveS()'>+500 orbs</button><button onclick='sv([])'>Reset save</button><br><input id=dl type=number min=1 max=100 style='width:70px'><button onclick='load((+$("dl").value||1)-1)'>Go</button>`;
          document.body.appendChild(e);
        }
        e.style.display = dbgOn ? "block" : "none";
      }
      function dbgU() {
        const b = document.body.classList,
          ing = st == "play" || st == "dying";
        if (b.contains("ing") !== ing) b.toggle("ing", ing);
        humU((M.k || M.m || M.t) && st == "play");
        fc++;
        const n = performance.now();
        if (n - ft > 500) {
          fps = Math.round((fc * 1000) / (n - ft));
          fc = 0;
          ft = n;
          const s = $("ds");
          if (s && dbgOn && L)
            s.textContent =
              VER +
              "\nFPS " +
              fps +
              "  God " +
              god +
              "  UnlockAll " +
              UA +
              "\nLevel " +
              (lv + 1) +
              " (" +
              L.n +
              ")  World " +
              ((L.wd | 0) + 1) +
              "  Size " +
              L.w +
              "x" +
              L.h +
              "\nPos " +
              (P.x | 0) +
              "," +
              (P.y | 0) +
              "  Mode " +
              mode +
              "  Orbs " +
              SAVE.c +
              "\nInput " +
              (touchOn ? "touch" : "keyboard");
        }
      }
      /* ---------- loading screen ---------- */
      document.body.insertAdjacentHTML(
        "beforeend",
        "<div id=vr>" +
          VER +
          '</div><div id=ld><div class=bgr></div><i class="ob o1"></i><i class="ob o2"></i><i class="ob o3"></i><div class=lw><svg viewBox="0 0 120 130" width="120"><path d="M30 12V64a30 30 0 0 0 30 30" fill="none" stroke="#d8403a" stroke-width="18"/><path d="M90 12V64a30 30 0 0 1-30 30" fill="none" stroke="#3a7bd8" stroke-width="18"/><rect x="21" y="4" width="18" height="14" fill="#e6eef8"/><rect x="81" y="4" width="18" height="14" fill="#e6eef8"/></svg><h1><b>MAGNET</b><br><i>MAYHEM</i></h1><div class=bar><i id=lb></i></div><button id=lp onclick="startG()">PLAY</button><div id=lt2>Loading...</div><button class=alt id=lgb onclick="logT()" style="font-size:13px;padding:6px 16px">What is new</button><div id=lg style="display:none"><b>' +
          VER +
          "</b><ul>" +
          LOG.map((l) => "<li>" + l + "</li>").join("") +
          "</ul></div></div></div>",
      );
      (function () {
        let p = 0;
        const iv = setInterval(() => {
          p += 4 + Math.random() * 9;
          if (p >= 100) {
            p = 100;
            clearInterval(iv);
            $("lp").style.visibility = "visible";
            $("lt2").textContent = "Ready!";
          }
          $("lb").style.width = p + "%";
        }, 90);
      })();
      function logT() {
        const e = $("lg");
        e.style.display = e.style.display == "none" ? "block" : "none";
      }
      function startG() {
        const e = $("ld");
        if (e) e.remove();
        au();
        sfx("click");
        menu();
      }
      addEventListener("keydown", (e) => {
        if (
          !PK.breaking &&
          $("ld") &&
          $("lp") &&
          $("lp").style.visibility == "visible" &&
          (e.code == "Enter" || e.code == "Space")
        )
          startG();
      });

      const PK = {
        on: false,
        ps: false,
        breaking: false,
        pauseAfterBreak: false,
        init() {
          if (!window.PokiSDK) return;
          let initialization;
          try {
            initialization = PokiSDK.init();
          } catch (error) {
            console.warn("Poki SDK initialization failed.", error);
            return;
          }
          Promise.resolve(initialization)
            .then(() => {
              PK.on = true;
              try {
                PokiSDK.gameLoadingFinished();
              } catch (error) {
                console.warn("Poki gameLoadingFinished failed.", error);
              }
              PK.start();
            })
            .catch((error) => {
              console.warn("Poki SDK initialization failed.", error);
            });
        },
        start() {
          if (!PK.on || PK.ps || PK.breaking || st != "play") return;
          PK.ps = true;
          try {
            PokiSDK.gameplayStart();
          } catch (error) {
            PK.ps = false;
            console.warn("Poki gameplayStart failed.", error);
          }
        },
        stop() {
          if (!PK.on || !PK.ps) return;
          PK.ps = false;
          try {
            PokiSDK.gameplayStop();
          } catch (error) {
            console.warn("Poki gameplayStop failed.", error);
          }
        },
        finishBreak(success, callback, previousState, previousMute) {
          const shouldPause = PK.pauseAfterBreak || document.hidden;
          mute = previousMute;
          if (st == "ad") st = previousState;
          try {
            if (success) callback();
          } finally {
            PK.breaking = false;
            PK.pauseAfterBreak = false;
            document.body.classList.remove("ad-lock");
            if (shouldPause && st == "play") pause();
            else PK.start();
          }
        },
        runBreak(kind, callback) {
          if (!PK.on) {
            callback();
            return;
          }
          if (PK.breaking) return;
          const previousState = st;
          const previousMute = mute;
          PK.breaking = true;
          PK.pauseAfterBreak = false;
          if (st == "play") st = "ad";
          PK.stop();
          clearInput();
          mute = 1;
          document.body.classList.add("ad-lock");
          if (document.pointerLockElement) {
            try {
              const release = document.exitPointerLock?.();
              release?.catch((error) =>
                console.warn(
                  "Could not release pointer lock before an ad.",
                  error,
                ),
              );
            } catch (error) {
              console.warn(
                "Could not release pointer lock before an ad.",
                error,
              );
            }
          }
          let request;
          try {
            request =
              kind == "reward"
                ? PokiSDK.rewardedBreak()
                : PokiSDK.commercialBreak(() => {
                    mute = 1;
                  });
          } catch (error) {
            console.warn(`Poki ${kind} break failed.`, error);
            PK.finishBreak(
              kind == "commercial",
              callback,
              previousState,
              previousMute,
            );
            return;
          }
          Promise.resolve(request).then(
            (result) =>
              PK.finishBreak(
                kind == "commercial" || Boolean(result),
                callback,
                previousState,
                previousMute,
              ),
            (error) => {
              console.warn(`Poki ${kind} break failed.`, error);
              PK.finishBreak(
                kind == "commercial",
                callback,
                previousState,
                previousMute,
              );
            },
          );
        },
        reward(callback) {
          PK.runBreak("reward", callback);
        },
        gate(callback) {
          PK.runBreak("commercial", callback);
        },
      };
      function load(n) {
        if (st == "win" && n !== lv) {
          PK.gate(() => loadRaw(n));
        } else {
          loadRaw(n);
          PK.start();
        }
      }
      addEventListener("wheel", (e) => e.preventDefault(), { passive: false });
      function loop(n) {
        const dt = Math.min(0.033, (n - last) / 1000);
        last = n;
        if (st == "play" && L) {
          upd(dt / 2);
          upd(dt / 2);
        } else if (st != "ad") {
          t += dt;
          if (st == "dying") dieU(dt);
          if (st == "menu" && L)
            cam.x = (cam.x + dt * 40) % Math.max(1, L.w * T - VW);
        }
        if (L) draw();
        dbgU();
        requestAnimationFrame(loop);
      }
      loadRaw(0);
      st = "menu";
      menu();
      PK.init();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
